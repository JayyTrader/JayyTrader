
name: Daily SDCA Update

on:
  schedule:
    # GitHub Actions uses UTC. Run daily at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sdca-daily-update
  cancel-in-progress: false

jobs:
  update-sdca:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out JayyTrader
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SDCA data pipeline
        run: python scripts/update_sdca.py

      - name: Commit updated SDCA data
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Daily SDCA data update"
            git push
          else
            echo "No data changes to commit."
          fi
