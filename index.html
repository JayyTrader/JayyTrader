<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080D12">
  <title>JayyTrader</title>
  <meta name="description" content="Transparent Bitcoin valuation research. Probabilities are the currency of the markets. No noise. Just signal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--cyan) 4%, transparent), transparent 58%),
        var(--bg);
      font-family: var(--font-ui);
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(color-mix(in srgb, var(--cyan) 2.5%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--cyan) 2.5%, transparent) 1px, transparent 1px),
        linear-gradient(color-mix(in srgb, var(--amber) .8%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--amber) .8%, transparent) 1px, transparent 1px);
      background-size: 48px 48px, 48px 48px, 192px 192px, 192px 192px;
      content: "";
      pointer-events: none;
      mask-image: linear-gradient(to bottom, #000, transparent 90%);
    }
    #cursor-glow {
      position: fixed;
      z-index: 0;
      top: 0;
      left: 0;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle,
        color-mix(in srgb, var(--cyan) 6.5%, transparent) 0%,
        color-mix(in srgb, var(--cyan) 3.5%, transparent) 32%,
        color-mix(in srgb, var(--cyan) 1.2%, transparent) 55%,
        transparent 72%);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity .35s ease;
      will-change: left, top;
    }
    @media (hover: hover) and (pointer: fine) {
      body:hover #cursor-glow { opacity: 1; }
    }
    .landing {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 64px), 1480px);
      margin: 0 auto;
      padding: 118px 0 48px;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 300px);
      align-items: stretch;
      gap: 16px;
    }
    .research-column {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      text-align: left;
    }
    .oscillator-panel {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 22px 24px 18px;
      border: var(--border-hairline);
      border-top: 1px solid color-mix(in srgb, var(--cyan) 55%, transparent);
      background: linear-gradient(145deg, var(--panel2), var(--panel));
      box-shadow: 0 14px 42px rgba(0, 0, 0, .22);
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }
    .oscillator-heading-copy { min-width:0; }
    .oscillator-title-row { display:flex; align-items:baseline; flex-wrap:wrap; gap:10px; }
    #oscillator-heading-score { color:var(--muted); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.015em; white-space:nowrap; }
    #oscillator-heading-score[data-state="undervalued"] { color:var(--cyan); }
    #oscillator-heading-score[data-state="overvalued"] { color:var(--amber); }
    .oscillator-heading-score-empty { display:none; }
    .panel-title {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .panel-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .035em;
      line-height: 1.5;
    }
    .empty-state {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .1em;
      white-space: nowrap;
    }
    .oscillator-plot {
      display: block;
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      height: 0;
      overflow: visible;
    }
    .oscillator-zone { stroke: none; }
    .oscillator-zone.overvalued { fill: rgba(240,68,68,.13); }
    .oscillator-zone.middle { fill: rgba(217,154,54,.10); }
    .oscillator-zone.undervalued { fill: rgba(0,210,140,.13); }
    .oscillator-grid { stroke: var(--line); stroke-width: 1; opacity: .68; }
    .oscillator-history-segment { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .oscillator-history-segment[data-zone="overvalued"] { stroke: #f04444; }
    .oscillator-history-segment[data-zone="middle"] { stroke: #e6a13a; }
    .oscillator-history-segment[data-zone="undervalued"] { stroke: #00d28c; }
    .oscillator-history-point[data-zone="overvalued"] { stroke: #f04444; }
    .oscillator-history-point[data-zone="middle"] { stroke: #e6a13a; }
    .oscillator-history-point[data-zone="undervalued"] { stroke: #00d28c; }
    .oscillator-date-label { font-size: 10px; }
    .oscillator-grid.zero { stroke: color-mix(in srgb, var(--cyan) 64%, transparent); stroke-width: 1.6; opacity: 1; }
    .oscillator-label {
      fill: var(--muted);
      font-family: var(--font-ui);
      font-size: 12px;
    }
    .oscillator-label.extreme { fill: var(--amber); }
    .oscillator-caption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .025em;
      line-height: 1.6;
    }
    h1 {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 2;
      margin: 0;
      font-size: clamp(10.5px, 2.25vw, 19px);
      font-weight: 750;
      letter-spacing: -.065em;
      line-height: 1;
    }
    h1 span {
      color: var(--cyan);
      text-shadow: var(--glow-cyan-soft);
    }
    .cursor {
      display: inline-block;
      width: 3px;
      height: .82em;
      margin-left: 8px;
      background: var(--cyan);
      vertical-align: middle;
      transform: translateY(-.04em);
      animation: blink 1.06s step-end infinite;
    }
    @keyframes blink { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .tagline {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 2vw, 16px);
      line-height: 1.7;
    }
    .trend-instruments { display: flex; flex-direction: column; gap: 16px; min-width: 0; margin: 0; }
    .trend-instrument {
      position: relative;
      min-width: 0;
      padding: 18px 20px 14px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
      border-top: 1px solid color-mix(in srgb, var(--cyan) 68%, transparent);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--cyan) 3.5%, transparent), transparent 46%),
        linear-gradient(145deg, var(--panel2), var(--panel));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025), 0 14px 34px rgba(0, 0, 0, .2);
    }
    .trend-instrument::before {
      position: absolute; top: 0; left: 20px; width: 42px; height: 2px;
      background: var(--cyan); box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 35%, transparent);
      content: "";
    }
    .trend-instrument::after {
      position: absolute; right: 0; bottom: 0; width: 34px; height: 34px;
      border-right: 1px solid color-mix(in srgb, var(--cyan) 38%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--cyan) 38%, transparent);
      content: "";
    }
    .trend-instrument[data-horizon="medium"] {
      border-top-color: color-mix(in srgb, var(--amber) 72%, transparent);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--amber) 3.5%, transparent), transparent 46%),
        linear-gradient(145deg, var(--panel2), var(--panel));
    }
    .trend-instrument[data-horizon="medium"]::before { background: var(--amber); box-shadow: 0 0 12px color-mix(in srgb, var(--amber) 35%, transparent); }
    .trend-instrument[data-horizon="medium"]::after { border-color: color-mix(in srgb, var(--amber) 38%, transparent); }
    .trend-instrument-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .trend-instrument-title { margin: 0; color: var(--text); font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    .trend-instrument-code { margin-top: 5px; color: var(--muted); font-size: 8px; letter-spacing: .16em; }
    .trend-instrument-state { padding: 4px 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 65%, transparent); color: var(--muted); font-size: 8px; letter-spacing: .1em; white-space: nowrap; }
    .trend-gauge { display: block; width: 100%; height: auto; max-height: 205px; margin: 5px auto 0; overflow: visible; }
    .trend-gauge-track { fill: none; stroke: #202c35; stroke-width: 14; }
    .trend-gauge-edge { fill: none; stroke: #52616b; stroke-width: 1; opacity: .72; }
    .trend-gauge-accent { fill: none; stroke: var(--cyan); stroke-width: 2; stroke-linecap: square; stroke-dasharray: 22 7 3 7 22 7 3 7 22 7 3 7; opacity: .95; }
    .trend-instrument[data-horizon="medium"] .trend-gauge-accent { stroke: var(--amber); }
    .trend-gauge-inner { fill: none; stroke: #293943; stroke-width: 1; stroke-dasharray: 1 5; }
    .trend-gauge-tick { stroke: #62717b; stroke-width: 1; }
    .trend-gauge-tick.major { stroke: #b4c0c7; stroke-width: 1.6; }
    .trend-gauge-scale { fill: var(--muted); font-family: var(--font-ui); font-size: 10px; letter-spacing: .04em; }
    /* Gauge regime text follows the live classification. */
    .trend-instrument[data-score-state="risk-off"] #ltpi-regime-label,
    .trend-instrument[data-score-state="risk-off"] #mtpi-regime-scale { fill: #ef777d; }
    .trend-instrument[data-score-state="neutral"] #ltpi-regime-label,
    .trend-instrument[data-score-state="neutral"] #mtpi-regime-scale,
    .trend-instrument[data-score-state="empty"] #ltpi-regime-label,
    .trend-instrument[data-score-state="empty"] #mtpi-regime-scale { fill: #9aa6b2; }
    .trend-instrument[data-score-state="risk-on"] #ltpi-regime-label,
    .trend-instrument[data-score-state="risk-on"] #mtpi-regime-scale { fill: #36d399; }
    .trend-gauge-center { fill: var(--text); font-family: var(--font-ui); font-size: 26px; font-weight: 600; letter-spacing: .04em; }
    .trend-gauge-placeholder { fill: var(--cyan); font-family: var(--font-ui); font-size: 9px; font-weight: 600; letter-spacing: .16em; }
    .trend-instrument[data-horizon="medium"] .trend-gauge-placeholder { fill: var(--amber); }
    .trend-gauge-caption { display: flex; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
    .oscillator-panel {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 22px 24px 18px;
      border: var(--border-hairline);
      border-top: 1px solid color-mix(in srgb, var(--cyan) 55%, transparent);
      background: linear-gradient(145deg, var(--panel2), var(--panel));
      box-shadow: 0 14px 42px rgba(0, 0, 0, .22);
    }
    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .panel-title {
      margin: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .panel-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }
    .empty-state {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .1em;
      white-space: nowrap;
    }
    .oscillator-plot {
      display: block;
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      height: 0;
      overflow: visible;
    }
    .oscillator-grid { stroke: var(--line); stroke-width: 1; }
    .oscillator-grid.zero { stroke: color-mix(in srgb, var(--cyan) 48%, transparent); stroke-width: 1.4; }
    .oscillator-label {
      fill: var(--muted);
      font-family: var(--font-ui);
      font-size: 12px;
    }
    .oscillator-label.extreme { fill: var(--amber); }
    .oscillator-caption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.6;
    }
    .motto {
      margin: 9px 0 0;
      color: var(--cyan-soft);
      font-size: 10px;
      letter-spacing: .035em;
      line-height: 1.6;
    }
    .regime-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 33.333%;
      margin: 0 auto 18px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--muted);
      background: var(--panel);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .regime-label { color: var(--muted); font-size: 10px; font-weight: 650; }
    .regime-value { color: var(--text); font-size: 13px; font-weight: 750; }
    .regime-panel[data-regime="risk-off"] { border-left-color: #F04444; }
    .regime-panel[data-regime="risk-off"] .regime-value { color: #F04444; }
    .regime-panel[data-regime="risk-on"] { border-left-color: var(--green); }
    .regime-panel[data-regime="risk-on"] .regime-value { color: var(--green); }
    .regime-panel[data-regime="neutral"] { border-left-color: var(--text); }
    .regime-panel[data-regime="neutral"] .regime-value { color: var(--text); }
    @media (max-width: 600px) {
      .regime-panel { width: 100%; padding: 12px 14px; }
      .regime-value { font-size: 11px; }
    }
    .system-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .1em;
      line-height: 1.6;
      text-transform: uppercase;
    }
    .system-footer span:last-child { text-align: right; }
    .sdca-panel {
      margin-top:24px; padding:20px; border:1px solid var(--line);
      border-top:1px solid color-mix(in srgb,var(--cyan) 55%,transparent);
      background:linear-gradient(145deg,var(--panel2),var(--panel)); box-shadow:0 14px 42px rgba(0,0,0,.18);
    }
    .sdca-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
    .sdca-title { margin:0; color:var(--text); font-size:14px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; }
    .sdca-subtitle { margin:5px 0 0; color:var(--muted); font-size:9px; line-height:1.6; }
    .sdca-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
    .sdca-card {
      display:flex; min-width:0; min-height:52px; flex-direction:column; justify-content:space-between; gap:4px;
      padding:6px 7px 5px; border:1px solid #29343c; border-radius:2px;
      background:linear-gradient(145deg,rgba(29,43,53,.72),rgba(8,13,18,.92));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.018); transition:border-color .15s ease,box-shadow .15s ease;
    }
    .sdca-card[data-sign="positive"] { border-color:color-mix(in srgb,var(--cyan) 85%,transparent); box-shadow:inset 0 0 10px color-mix(in srgb,var(--cyan) 8%,transparent),0 0 7px color-mix(in srgb,var(--cyan) 16%,transparent); }
    .sdca-card[data-sign="negative"] { border-color:color-mix(in srgb,var(--amber) 88%,transparent); box-shadow:inset 0 0 10px color-mix(in srgb,var(--amber) 7%,transparent),0 0 7px color-mix(in srgb,var(--amber) 15%,transparent); }
    .sdca-card[data-sign="zero"] { border-color:#35414a; box-shadow:inset 0 0 8px rgba(150,165,175,.035); }
    .sdca-indicator-name { color:var(--muted); font-size:9px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
    .sdca-score-input {
      display:block; width:100%; min-width:0; padding:2px 2px 1px; border:0; border-bottom:1px solid var(--line);
      border-radius:0; outline:none; background:transparent; color:var(--text); font:600 12px/1.15 var(--font-ui);
      font-variant-numeric:tabular-nums; caret-color:var(--cyan);
    }
    .sdca-score-input::placeholder { color:#52616b; opacity:1; }
    .sdca-score-input:focus-visible { border-bottom-color:var(--cyan); box-shadow:0 2px 0 color-mix(in srgb,var(--cyan) 25%,transparent); }
    .sdca-summary { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; margin-top:12px; padding:11px 12px; border:1px solid var(--line); background:rgba(8,13,18,.58); }
    .sdca-summary-label { color:var(--muted); font-size:8px; letter-spacing:.1em; text-transform:uppercase; }
    .sdca-composite { display:block; margin-top:4px; color:var(--cyan); font-size:clamp(21px,2.5vw,29px); font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
    .sdca-classification { padding:6px 8px; border:1px solid #35414a; color:var(--muted); font-size:8px; letter-spacing:.08em; text-align:center; white-space:nowrap; }
    .sdca-classification[data-class="positive"] { border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 8px color-mix(in srgb,var(--cyan) 13%,transparent); }
    .sdca-classification[data-class="negative"] { border-color:var(--amber); color:var(--amber); box-shadow:0 0 8px color-mix(in srgb,var(--amber) 13%,transparent); }
    .sdca-confirm-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px; }
    .sdca-confirm-button {
      padding:9px 12px; border:1px solid var(--cyan); background:color-mix(in srgb,var(--cyan) 8%,var(--bg));
      color:var(--cyan); font:600 9px/1.2 var(--font-ui); letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
      transition:background .15s ease,box-shadow .15s ease,opacity .15s ease;
    }
    .sdca-confirm-button:hover:not(:disabled),.sdca-confirm-button:focus-visible { background:color-mix(in srgb,var(--cyan) 15%,var(--bg)); box-shadow:0 0 12px color-mix(in srgb,var(--cyan) 20%,transparent); outline:none; }
    .sdca-confirm-button:disabled { border-color:var(--line); color:var(--muted); cursor:not-allowed; opacity:.55; }
    .sdca-confirm-status { color:var(--muted); font-size:8px; line-height:1.5; }
    .sdca-note { margin:8px 0 0; color:var(--muted); font-size:8px; line-height:1.6; }
    .oscillator-history-path { fill:none; stroke:var(--cyan); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; filter:drop-shadow(0 0 4px color-mix(in srgb,var(--cyan) 45%,transparent)); }
    .oscillator-history-point { fill:var(--bg); stroke:var(--cyan); stroke-width:2.5; }
    .oscillator-date-label { fill:var(--muted); font-family:var(--font-ui); font-size:10px; }
    @media (max-width:900px) { .sdca-grid { grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; } }
    @media (max-width:600px) {
      .sdca-panel { padding:14px 12px; }
      .sdca-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
      .sdca-card { min-height:49px; padding:5px; }
      .sdca-indicator-name { font-size:8px; }
      .sdca-score-input { font-size:11px; }
      .sdca-summary { grid-template-columns:minmax(0,1fr); gap:8px; }
      .sdca-classification { justify-self:start; }
      .sdca-heading { flex-direction:column; gap:7px; }
      .sdca-confirm-row { align-items:flex-start; flex-direction:column; gap:7px; }
    }

    @media (max-width: 900px) {
      .landing { width: min(100% - 40px, 720px); padding-top: 108px; }
      .trend-instruments { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .dashboard-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .research-column { display: block; }
      .oscillator-panel { margin-top: 0; min-height: 0; }
      .mvrv-score-row { margin-top:14px; }
      .oscillator-plot { min-height: 280px; }
    }
    @media (max-width: 600px) {
      h1 { top: 16px; left: 16px; font-size: clamp(10.5px, 3vw, 14px); }
      .landing { width: min(100% - 32px, 720px); padding-top: 92px; }
      .trend-instruments { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .trend-instrument { padding: 16px 14px 12px; }

  <script>
    (() => {
      const key = "jxprobability.ltpi.manualScores.v2";
      const card = document.querySelector('.trend-instrument[data-horizon="long"]');
      const total = document.getElementById("ltpi-total");
      const count = document.getElementById("ltpi-count");
      const needle = document.getElementById("ltpi-needle");
      const caption = document.getElementById("ltpi-caption");
      const regimeLabel = document.getElementById("ltpi-regime-label");
      const regimePanel = document.getElementById("regimePanel");
      const regimeValue = document.getElementById("regimeValue");
      const fmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0, signDisplay: "always" });
      function render() {
        let scores = {};
        try {
          const raw = localStorage.getItem(key);
          const parsed = raw ? JSON.parse(raw) : {};
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) scores = parsed;
        } catch (error) { console.warn("LTPI scores could not be loaded.", error); }
        const vals = Object.entries(scores).filter(([k, v]) => Number.isInteger(Number(k)) && Number(k) >= 1 && Number(k) <= 16 && (v === -1 || v === 0 || v === 1)).map(([, v]) => v);
        if (!vals.length) {
          total.textContent = "—"; count.textContent = "NO SCORE";
          caption.textContent = "16 indicators · awaiting scores";
          needle.setAttribute("transform", "rotate(0 160 137)");
          card.dataset.scoreState = "empty";
          regimeLabel.textContent = "AWAITING INPUTS";
          regimeValue.textContent = "AWAITING INPUTS";
          regimePanel.dataset.regime = "neutral";
          return;
        }
        const aggregate = vals.reduce((a, v) => a + v, 0) / vals.length;
        const angle = aggregate * 90;
        const classification = aggregate < -0.25 ? "RISK OFF" : aggregate > 0.25 ? "RISK ON" : "NEUTRAL";
        const regime = aggregate < -0.25 ? "risk-off" : aggregate > 0.25 ? "risk-on" : "neutral";
        regimeLabel.textContent = classification;
        regimeValue.textContent = classification;
        regimePanel.dataset.regime = regime;
        total.textContent = (aggregate > 0 ? "+" : "") + aggregate.toFixed(2);
        count.textContent = vals.length + "/16 SCORED";
        caption.textContent = "BTC/USD · 3D";
        needle.setAttribute("transform", "rotate(" + angle + " 160 137)");
        card.dataset.scoreState = regime;
      }
      render();
      window.addEventListener("storage", e => { if (e.key === key || e.key === null) render(); });
    })();
  </script>

  <script>
    (function () {
      const storageKey="jxprobability.sdca.manualScores.v1",historyKey="jxprobability.sdca.compositeHistory.v1";
      const marker=document.getElementById("oscillator-live-score"),line=document.getElementById("oscillator-score-line"),label=document.getElementById("oscillator-score-label"),headingScore=document.getElementById("oscillator-heading-score"),stateLabel=document.getElementById("oscillator-state-label");
      const chartTitle=document.getElementById("oscillator-chart-title"),chartDesc=document.getElementById("oscillator-chart-desc"),historyPath=document.getElementById("oscillator-history-path"),historyPoints=document.getElementById("oscillator-history-points"),dateLabels=document.getElementById("oscillator-date-labels");
      const numberFormat=new Intl.NumberFormat("en-US",{maximumFractionDigits:4}),svgNS="http://www.w3.org/2000/svg";let saved={},history=[];
      function loadState(){try{const raw=localStorage.getItem(storageKey),parsed=raw?JSON.parse(raw):{};saved=parsed&&typeof parsed==="object"&&!Array.isArray(parsed)?parsed:{};}catch(error){saved={};console.warn("SDCA scores could not be loaded from local storage.",error);}
        try{const raw=localStorage.getItem(historyKey),parsed=raw?JSON.parse(raw):[];history=Array.isArray(parsed)?parsed.filter((item)=>item&&/^\d{4}-\d{2}-\d{2}$/.test(item.date)&&Number.isFinite(item.score)).sort((a,b)=>a.date.localeCompare(b.date)):[];}catch(error){history=[];console.warn("SDCA history could not be loaded from local storage.",error);}}
      function classify(v){if(v<=-1.5)return{label:"NO VALUE",kind:"negative"};if(v<0)return{label:"LOW VALUE",kind:"negative"};if(v===0)return{label:"NEUTRAL",kind:"neutral"};if(v<1.5)return{label:"VALUE",kind:"positive"};return{label:"HIGH VALUE",kind:"positive"};}
      function displayDate(key,withYear=true){const p=key.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("en-US",withYear?{month:"short",day:"numeric",year:"2-digit"}:{month:"short",day:"numeric"});}
      function zoneFor(v){return v<=-1?"overvalued":v>=1?"undervalued":"middle";}
      function makeSvg(tag,attrs){const node=document.createElementNS(svgNS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,String(v)));return node;}
      function drawHistory(){historyPath.setAttribute("d","");historyPoints.replaceChildren();dateLabels.replaceChildren();if(!history.length)return;const left=82,right=890;
        const dateValue=(key)=>{const p=key.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).getTime();};
        const firstDate=dateValue(history[0].date),lastDate=dateValue(history[history.length-1].date),dateSpan=lastDate-firstDate;
        const points=history.map((item)=>({...item,x:dateSpan===0?(left+right)/2:left+((dateValue(item.date)-firstDate)/dateSpan)*(right-left),y:194+Math.max(-2,Math.min(2,item.score))*83,zone:zoneFor(item.score)}));
        points.slice(1).forEach((p,i)=>{const prev=points[i],segment=makeSvg("path",{d:"M "+prev.x.toFixed(2)+" "+prev.y.toFixed(2)+" L "+p.x.toFixed(2)+" "+p.y.toFixed(2),class:"oscillator-history-segment","data-zone":zoneFor((prev.score+p.score)/2)});historyPoints.appendChild(segment);});
        points.forEach((p)=>{const circle=makeSvg("circle",{cx:p.x,cy:p.y,r:4,class:"oscillator-history-point","data-zone":p.zone,tabindex:0,role:"img","aria-label":displayDate(p.date)+", composite "+p.score.toFixed(4)});const title=makeSvg("title",{});title.textContent=displayDate(p.date)+" · "+((p.score>0?"+":"")+numberFormat.format(p.score))+" · "+p.count+" indicators";circle.appendChild(title);historyPoints.appendChild(circle);});
        const candidates=[0,points.length-1],maxTicks=5;for(let i=1;i<Math.min(maxTicks-1,points.length-1);i++)candidates.push(Math.round(i*(points.length-1)/(maxTicks-1)));
        const indexes=[];candidates.sort((a,b)=>a-b).forEach((idx)=>{if(!indexes.length||points[idx].x-points[indexes[indexes.length-1]].x>=82)indexes.push(idx);});
        if(points.length>1&&indexes[indexes.length-1]!==points.length-1){while(indexes.length>1&&points[points.length-1].x-points[indexes[indexes.length-1]].x<82)indexes.pop();indexes.push(points.length-1);}
        indexes.forEach((i)=>{const p=points[i],anchor=points.length===1?"middle":i===0?"start":i===points.length-1?"end":"middle",x=points.length===1?p.x:i===0?left:i===points.length-1?right:p.x,node=makeSvg("text",{x,y:395,"text-anchor":anchor,class:"oscillator-date-label"});node.textContent=displayDate(p.date,false);dateLabels.appendChild(node);});}
      function render(){const values=Object.values(saved).filter((v)=>typeof v==="number"&&Number.isFinite(v));
        if(!values.length){marker.setAttribute("visibility","hidden");headingScore.textContent="";headingScore.removeAttribute("data-state");chartTitle.textContent="Valuation oscillator awaiting manual scores";chartDesc.textContent="No manual SDCA scores are entered. Confirmed weekly history, if present, remains displayed.";return;}
        const avg=values.reduce((s,v)=>s+v,0)/values.length,formatted=(avg>0?"+":"")+numberFormat.format(avg);
        const y=194+Math.max(-2,Math.min(2,avg))*83;line.setAttribute("y1",String(y));line.setAttribute("y2",String(y));line.style.stroke=avg<=-1?"#f04444":avg>=1?"#00d28c":"#e6a13a";label.setAttribute("y",String(Math.max(42,y-9)));label.textContent="";marker.setAttribute("visibility","visible");
        const valuationState=avg>0?"UNDERVALUED":avg<0?"OVERVALUED":"NEUTRAL";
        headingScore.textContent=formatted;headingScore.dataset.state=avg>0?"undervalued":avg<0?"overvalued":"neutral";stateLabel.textContent=valuationState;stateLabel.dataset.state=avg>0?"undervalued":avg<0?"overvalued":"neutral";
        chartTitle.textContent="Valuation oscillator: "+valuationState+" · current SDCA average "+formatted;chartDesc.textContent="Positive averages indicate undervaluation, negative averages indicate overvaluation, and zero is neutral. The dashed line is the current unconfirmed average. The solid line shows confirmed weekly averages by date. Chart positions are clamped to the minus two to plus two range.";}
      loadState();drawHistory();render();window.addEventListener("storage",(e)=>{if(e.key===storageKey||e.key===historyKey||e.key===null){loadState();drawHistory();render();}});})();
  </script>
