<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080D12">
  <title>JxProbability</title>
  <meta name="description" content="Transparent Bitcoin valuation research. Probabilities are the currency of the markets. No noise. Just signal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--cyan) 4%, transparent), transparent 58%),
        var(--bg);
      font-family: var(--font-ui);
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(color-mix(in srgb, var(--cyan) 2.5%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--cyan) 2.5%, transparent) 1px, transparent 1px),
        linear-gradient(color-mix(in srgb, var(--amber) .8%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--amber) .8%, transparent) 1px, transparent 1px);
      background-size: 48px 48px, 48px 48px, 192px 192px, 192px 192px;
      content: "";
      pointer-events: none;
      mask-image: linear-gradient(to bottom, #000, transparent 90%);
    }
    #cursor-glow {
      position: fixed;
      z-index: 0;
      top: 0;
      left: 0;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle,
        color-mix(in srgb, var(--cyan) 6.5%, transparent) 0%,
        color-mix(in srgb, var(--cyan) 3.5%, transparent) 32%,
        color-mix(in srgb, var(--cyan) 1.2%, transparent) 55%,
        transparent 72%);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity .35s ease;
      will-change: left, top;
    }
    @media (hover: hover) and (pointer: fine) {
      body:hover #cursor-glow { opacity: 1; }
    }
    .landing {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 720px);
      padding: 48px 0;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 76px);
      font-weight: 750;
      letter-spacing: -.065em;
      line-height: 1;
    }
    h1 span {
      color: var(--cyan);
      text-shadow: var(--glow-cyan-soft);
    }
    .cursor {
      display: inline-block;
      width: 3px;
      height: .82em;
      margin-left: 8px;
      background: var(--cyan);
      box-shadow: var(--glow-cyan-soft);
      vertical-align: -.02em;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .18; } }
    .tagline {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 2vw, 16px);
      line-height: 1.7;
    }
    .motto {
      margin: 12px 0 0;
      color: var(--cyan-soft);
      font-size: 11px;
      letter-spacing: .04em;
      line-height: 1.7;
    }
    .quote {
      width: min(100%, 390px);
      margin: 38px auto 0;
      padding: 16px 18px;
      border: var(--border-hairline);
      border-top: 1px solid color-mix(in srgb, var(--amber) 58%, transparent);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--amber) 8%, transparent), 0 14px 42px rgba(0, 0, 0, .22);
      background: linear-gradient(145deg, var(--panel2), var(--panel));
      text-align: left;
    }
    .quote-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .quote-label {
      padding-left: 7px;
      border-left: 1px solid var(--amber);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .16em;
    }
    .price {
      display: block;
      margin-top: 5px;
      color: var(--text);
      font-size: clamp(22px, 5vw, 27px);
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      letter-spacing: -.03em;
    }
    .live-quote-status {
      max-width: 185px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
      text-align: right;
    }
    .live-quote-status[data-status="live"] { color: var(--cyan); }
    .live-quote-status[data-status="stale"],
    .live-quote-status[data-status="error"] { color: var(--amber); }
    .quote-details {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 8px;
      line-height: 1.5;
    }
    .quote-details a {
      color: var(--muted);
      text-decoration: none;
      text-underline-offset: 3px;
    }
    .quote-details a:hover,
    .quote-details a:focus-visible { color: var(--cyan); text-decoration: underline; }
    .quote-details a:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }
    @media (max-width: 480px) {
      .landing { width: min(100% - 32px, 720px); }
      .quote { margin-top: 30px; padding: 14px; }
      .quote-primary { align-items: flex-start; flex-direction: column; gap: 9px; }
      .live-quote-status { max-width: none; text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <div id="cursor-glow" aria-hidden="true"></div>
  <main class="landing">
    <h1>Jx<span>Probability</span><span class="cursor" aria-hidden="true"></span></h1>
    <p class="tagline">Transparent valuation research. Systematic accumulation intelligence.</p>
    <p class="motto">Probabilities are the currency of the markets. No noise. Just signal.</p>

    <section class="quote" aria-label="Live Bitcoin to US dollar quote">
      <div class="quote-primary">
        <div>
          <span class="quote-label">BTC / USD</span>
          <strong class="price" id="live-btc-usd-price">Loading…</strong>
        </div>
        <p class="live-quote-status" id="live-btc-usd-status" role="status" aria-live="polite">Connecting to Coinbase Exchange…</p>
      </div>
      <div class="quote-details">
        <span>Updated <time id="live-btc-usd-updated">Unavailable</time></span>
        <a id="live-btc-usd-source" href="https://docs.cdp.coinbase.com/api-reference/exchange-api/rest-api/products/get-product-ticker" target="_blank" rel="noopener noreferrer">Coinbase Exchange ↗</a>
      </div>
    </section>
  </main>
  <script src="scripts/live-btc-usd.js"></script>
  <script>
    function formatTimestamp(value) {
      if (!value) return "Not available";
      const epoch = typeof value === "string" && /^\d{10}$/.test(value) ? Number(value) * 1000 : value;
      const date = new Date(epoch);
      if (Number.isNaN(date.getTime())) return "Invalid timestamp";
      return date.toLocaleString("en-GB", {
        timeZone: "UTC", year: "numeric", month: "short", day: "2-digit",
        hour: "2-digit", minute: "2-digit", timeZoneName: "short"
      });
    }

    function renderLiveBTCUSD(state) {
      const price = document.getElementById("live-btc-usd-price");
      const status = document.getElementById("live-btc-usd-status");
      const updated = document.getElementById("live-btc-usd-updated");
      status.dataset.status = state.status;

      if (Number.isFinite(state.price) && state.price > 0) {
        price.textContent = LiveBTCUSD.formatUSDPrice(state.price);
      } else if (state.status === "loading") {
        price.textContent = "Loading…";
      } else {
        price.textContent = "Unavailable";
      }

      updated.textContent = state.receivedAt ? formatTimestamp(state.receivedAt) : "Unavailable";
      if (state.status === "live") {
        status.textContent = `LIVE · Coinbase Exchange last trade ${formatTimestamp(state.sourceTime)}`;
      } else if (state.status === "refreshing") {
        status.textContent = "Refreshing · showing the last successful quote";
      } else if (state.status === "stale") {
        status.textContent = `STALE · refresh failed: ${state.error}. Displayed price is from the last successful update.`;
      } else if (state.status === "error") {
        status.textContent = `Connection error: ${state.error}. No current quote is available.`;
      } else {
        status.textContent = "Connecting to Coinbase Exchange…";
      }
    }

    const cursorGlow = document.getElementById("cursor-glow");
    window.addEventListener("pointermove", (event) => {
      cursorGlow.style.left = `${event.clientX}px`;
      cursorGlow.style.top = `${event.clientY}px`;
    }, { passive: true });

    const liveBTCUSDController = LiveBTCUSD.createController({ onState: renderLiveBTCUSD });
    void liveBTCUSDController.start();
  </script>
</body>
</html>
