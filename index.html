<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020504">
  <title>JayyTrader | BTC Intelligence</title>
  <meta name="description" content="JayyTrader — quantitative Bitcoin research.">

  <style>
    :root {
      --bg: #020403;
      --green: #00f5a0;
      --mint: #a2ffdc;
      --muted: #788b82;
      --line: rgba(0, 245, 160, 0.20);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #effff8;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(0, 80, 49, .20), transparent 55%),
        #020403;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 245, 160, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 160, .025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    /* Mouse-following green light */
    #cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      background: radial-gradient(
        circle,
        rgba(0, 255, 153, .085) 0%,
        rgba(0, 200, 120, .045) 32%,
        rgba(0, 150, 90, .015) 55%,
        transparent 72%
      );
      transform: translate(-50%, -50%);
      transition: opacity .35s ease;
      will-change: left, top;
    }

    header {
      min-height: 68px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      border-bottom: 1px solid rgba(0, 245, 160, .13);
      background: rgba(0, 0, 0, .62);
    }

    .brand {
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -1px;
    }

    .brand span { color: var(--green); }

    .market-status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a0b4aa;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(0, 255, 153, .8);
      flex-shrink: 0;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 125px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 75px 20px 95px;
      text-align: center;
    }

    .eyebrow {
      color: var(--green);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 27px;
    }

    h1 {
      max-width: 900px;
      font-size: clamp(43px, 8vw, 88px);
      line-height: 1.06;
      letter-spacing: -4px;
      font-weight: 800;
    }

    h1 span {
      color: #72ffd0;
      background: linear-gradient(100deg, #eafff6, #00f5a0 55%, #9affdc);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 22px;
      color: #83948b;
      font-size: 13px;
      letter-spacing: .7px;
      line-height: 1.8;
    }

    /* BTC price panel */
    .price-panel {
      position: relative;
      width: min(100%, 440px);
      margin-top: 60px;
      padding: 31px 28px 25px;
      border: 1px solid rgba(0, 245, 160, .34);
      border-radius: 9px;
      background: rgba(1, 7, 4, .82);
      box-shadow:
        0 0 35px rgba(0, 245, 160, .035),
        inset 0 0 30px rgba(0, 245, 160, .018);
      text-align: left;
      overflow: hidden;
    }

    .price-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      opacity: .7;
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .asset-name {
      font-size: 12px;
      letter-spacing: 2px;
      color: #a8b9b0;
    }

    .asset-name strong {
      color: #f2fff9;
      font-weight: 700;
    }

    .live-label {
      color: var(--green);
      font-size: 9px;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .price {
      margin-top: 28px;
      font-size: clamp(35px, 7vw, 49px);
      font-weight: 650;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .change {
      margin-top: 11px;
      font-size: 12px;
      color: #9aaba2;
      font-variant-numeric: tabular-nums;
    }

    .positive { color: #00e99a; }
    .negative { color: #ff747d; }

    .panel-divider {
      height: 1px;
      background: rgba(0, 245, 160, .13);
      margin: 25px 0 17px;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #65796e;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* TPI Research Lab */
    .research-lab {
      width: min(100%, 980px);
      margin-top: 72px;
      text-align: left;
    }

    .section-kicker {
      color: var(--green);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(27px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -1.5px;
      font-weight: 750;
    }

    .section-copy {
      color: #83948b;
      font-size: 12px;
      line-height: 1.8;
      margin-top: 12px;
      max-width: 650px;
    }

    .lab-topline {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .lab-count {
      flex: 0 0 auto;
      border: 1px solid rgba(0, 245, 160, .22);
      background: rgba(0, 245, 160, .045);
      border-radius: 7px;
      padding: 12px 15px;
      color: #9aaba2;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .lab-count strong {
      display: block;
      color: var(--green);
      font-size: 21px;
      letter-spacing: -.5px;
      margin-bottom: 4px;
    }

    .indicator-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 245, 160, .28);
      border-radius: 10px;
      padding: 25px;
      background: linear-gradient(135deg, rgba(2, 15, 9, .96), rgba(1, 6, 4, .92
